name: autopost

on:
  schedule:
    - cron: "5 * * * *"      # hourly planner (FB native scheduling, fixes, comments)
    - cron: "45 1 * * *"     # 07:15 IST -> 07:30 reel slot (Instagram + Dailymotion)
    - cron: "15 12 * * *"    # 17:45 IST -> 18:00 reel slot
    - cron: "15 14 * * *"    # 19:45 IST -> 20:00 main video slot
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | slot | baseline"
        default: plan
      dry_run:
        description: "1 = only print what would be posted"
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "5 * * * *" ]; then echo "mode=plan" >> $GITHUB_OUTPUT;
          else echo "mode=slot" >> $GITHUB_OUTPUT; fi
      - name: Run
        env:
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || '0' }}
          DRIVE_ROOT_ID: ${{ vars.DRIVE_ROOT_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DM_API_KEY: ${{ secrets.DM_API_KEY }}
          DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
          DM_USERNAME: ${{ secrets.DM_USERNAME }}
          DM_PASSWORD: ${{ secrets.DM_PASSWORD }}
          DM_PROFILE_ID: ${{ vars.DM_PROFILE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RESERVED_SLOTS: ${{ vars.RESERVED_SLOTS || '2026-11-22..2026-11-29@18:00' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m autopost "${{ steps.mode.outputs.mode }}"
      - name: Save state
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state/state.json || true
          git diff --cached --quiet || (git commit -m "state: ${{ steps.mode.outputs.mode }} $(date -u +%FT%TZ)" && git pull --rebase && git push)
