name: autopost

on:
  schedule:
    - cron: "50 * * * *"     # hourly planner at :50 (FB native scheduling, fixes, comments, fixed-time posts due in next 45 min)
    - cron: "15 1 * * *"     # 06:45 IST -> 07:00 reel slot
    - cron: "15 8 * * *"     # 13:45 IST -> 14:00 main video slot (2nd main video of the day)
    - cron: "15 12 * * *"    # 17:45 IST -> 18:00 reel slot + main video slot
    - cron: "30 14 * * 0"    # Sunday 20:00 IST -> weekly report
  workflow_dispatch:
    inputs:
      mode:
        description: "plan | slot | baseline | check | trial | audit | weekly | preview | unpost"
        default: plan
      dry_run:
        description: "1 = only print what would be posted"
        default: "0"
      match:
        description: "unpost only: text in the item name to delete from all platforms"
        default: ""
      drive_root:
        description: "trial only: Drive folder id to test (nothing is posted)"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "50 * * * *" ]; then echo "mode=plan" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "30 14 * * 0" ]; then echo "mode=weekly" >> $GITHUB_OUTPUT;
          else echo "mode=slot" >> $GITHUB_OUTPUT; fi
      - name: Run
        env:
          DRY_RUN: ${{ inputs.mode == 'trial' && '1' || inputs.dry_run || vars.DRY_RUN || '0' }}
          DRIVE_ROOT_ID: ${{ inputs.mode == 'trial' && inputs.drive_root || vars.DRIVE_ROOT_ID }}
          STATE_PATH: ${{ inputs.mode == 'trial' && '/tmp/trial/state.json' || 'state/state.json' }}
          UNPOST_MATCH: ${{ inputs.match }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DM_API_KEY: ${{ secrets.DM_API_KEY }}
          DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
          DM_USERNAME: ${{ secrets.DM_USERNAME }}
          DM_PASSWORD: ${{ secrets.DM_PASSWORD }}
          DM_PROFILE_ID: ${{ vars.DM_PROFILE_ID }}
          YT_ENABLED: ${{ vars.YT_ENABLED || '0' }}   # 0 until YouTube API audit approved; set '1' here (or repo var) to turn on
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_DAILY_QUOTA: ${{ vars.YT_DAILY_QUOTA }}
          RESERVED_SLOTS: ${{ vars.RESERVED_SLOTS || '2026-11-22..2026-11-29@18:00' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m autopost "${{ steps.mode.outputs.mode }}"
      - name: Save state
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "state: ${{ steps.mode.outputs.mode }} $(date -u +%FT%TZ)" && git pull --rebase && git push)
